<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>六级冲刺 · 背单词 + 听读写训练</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F5BDB'/%3E%3Ctext x='16' y='22' font-size='18' font-family='Georgia,serif' fill='white' text-anchor='middle'%3EC6%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap">
<style>
/* ===== 设计令牌 ===== */
:root{
  --paper:#F5F3EC;
  --card:#FFFFFF;
  --ink:#1E2634;
  --ink-soft:#4A5563;
  --muted:#8A93A2;
  --line:#E7E3D7;
  --primary:#2F5BDB;
  --primary-deep:#2247AD;
  --primary-soft:#EAF0FF;
  --amber:#F0A83A;
  --amber-soft:#FCF3E1;
  --good:#189A5C;
  --good-soft:#E7F6EE;
  --bad:#D84343;
  --bad-soft:#FBEAEA;
  --radius:16px;
  --radius-sm:12px;
  --shadow:0 6px 24px rgba(30,38,52,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  line-height:1.6;
  font-size:15px;
}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
a{color:var(--primary);text-decoration:none}

/* ===== 应用壳 ===== */
.app{max-width:960px;margin:0 auto;padding:0 16px 96px}
header.apphead{
  position:sticky;top:0;z-index:20;
  background:rgba(245,243,236,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.brandrow{max-width:960px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.logo{
  width:38px;height:38px;border-radius:10px;flex:none;
  background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif SC",Georgia,serif;font-weight:900;font-size:17px;
}
.brandtext b{display:block;font-size:16px;letter-spacing:.5px}
.brandtext span{font-size:11px;color:var(--muted)}
.headstatus{margin-left:auto;text-align:right}
.headstatus .streak{font-weight:900;color:var(--amber)}
.headstatus small{color:var(--muted);font-size:11px}

nav.tabs{
  max-width:960px;margin:0 auto;padding:0 12px;
  display:flex;gap:4px;overflow-x:auto;
}
nav.tabs .tab{
  flex:1;min-width:64px;white-space:nowrap;
  border:none;background:none;padding:12px 10px;font-size:14px;font-weight:700;
  color:var(--muted);position:relative;
}
nav.tabs .tab.active{color:var(--primary)}
nav.tabs .tab.active::after{content:"";position:absolute;left:20%;right:20%;bottom:0;height:3px;border-radius:3px;background:var(--primary)}
nav.tabs .tab .tic{font-size:11px;display:block;font-weight:500;margin-bottom:2px}

/* ===== 通用卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card + .card{margin-top:14px}
.sectiontitle{display:flex;align-items:baseline;gap:8px;margin:22px 0 12px}
.sectiontitle h2{margin:0;font-size:18px;font-family:"Noto Serif SC",serif}
.sectiontitle span{color:var(--muted);font-size:12px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:none;border-radius:var(--radius-sm);padding:10px 16px;
  font-size:14px;font-weight:700;color:#fff;background:var(--primary);
  transition:transform .12s,background .12s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.good{background:var(--good)}
.btn.amber{background:var(--amber);color:#3a2c0a}
.btn.bad{background:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

.chip{
  border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink-soft);
}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary);border-radius:8px;transition:width .3s}
.progress.amber i{background:var(--amber)}

.metricgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.metric{border-radius:var(--radius-sm);padding:14px;border:1px solid var(--line);background:var(--card)}
.metric .num{font-size:26px;font-weight:900;font-family:"Noto Serif SC",serif;line-height:1.1}
.metric .lbl{font-size:12px;color:var(--muted);margin-top:2px}
.metric.good .num{color:var(--good)}
.metric.amber .num{color:var(--amber)}

/* ===== 首页 ===== */
.hero{margin-top:18px;border-radius:20px;padding:24px 20px;color:#fff;
  background:linear-gradient(135deg,#2F5BDB 0%,#2247AD 60%,#1c3b91 100%);
  position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero::before{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{margin:0 0 4px;font-size:24px;font-family:"Noto Serif SC",serif}
.hero p{margin:0;font-size:13px;opacity:.9}
.hero .big{position:relative;z-index:1}
.herostats{display:flex;gap:22px;margin-top:18px;position:relative;z-index:1}
.herostats div{flex:1}
.herostats .n{font-size:22px;font-weight:900}
.herostats .s{font-size:11px;opacity:.85}
.modulegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.module{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);
  display:block;color:var(--ink);transition:transform .12s}
.module:active{transform:scale(.98)}
.module .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:12px}
.module .ic svg{width:22px;height:22px}
.module h3{margin:0;font-size:16px;font-family:"Noto Serif SC",serif}
.module p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.ic.blue{background:var(--primary-soft);color:var(--primary)}
.ic.gold{background:var(--amber-soft);color:#b97a13}
.ic.green{background:var(--good-soft);color:var(--good)}
.ic.pink{background:var(--bad-soft);color:var(--bad)}

.todaylist .tlitem{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.todaylist .tlitem:last-child{border-bottom:none}
.tlitem .nm{font-weight:700}
.tlitem .st{font-size:12px;color:var(--muted)}

/* ===== 词库 ===== */
.wordtop{position:sticky;top:92px;z-index:10;background:var(--paper);padding:10px 0}
.searchwrap{position:relative}
.searchwrap input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.searchwrap .sicon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.filterrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.filterrow .grow{flex:1}
.wordlist{display:flex;flex-direction:column;gap:10px}
.worditem{border:1px solid var(--line);background:var(--card);border-radius:var(--radius-sm);padding:13px 14px;cursor:pointer;box-shadow:var(--shadow)}
.worditem .top{display:flex;align-items:baseline;gap:8px}
.worditem .w{font-size:17px;font-weight:800;font-family:"Noto Serif SC",Georgia,serif}
.worditem .ph{font-size:12px;color:var(--muted)}
.worditem .pos{font-size:11px;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:2px 7px;font-weight:700}
.worditem .mean{font-size:14px;color:var(--ink-soft);margin-top:5px}
.worditem .ex{font-size:12.5px;color:var(--muted);margin-top:6px;border-left:3px solid var(--amber-soft);padding-left:8px}
.worditem .tag{margin-left:auto;font-size:11px;font-weight:700}
.tag.new{color:var(--primary)}
.tag.known{color:var(--good)}
.tag.learn{color:var(--amber)}
.worditem .stat{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
.worditem .stat button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--ink-soft)}
.worditem .stat button.ok{color:var(--good);border-color:var(--good)}
.worditem .stat button.no{color:var(--bad);border-color:var(--bad)}

/* 卡片模态 */
.flashmask{position:fixed;inset:0;background:rgba(20,26,40,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.flashmask.show{display:flex}
.flash{background:var(--card);border-radius:20px;max-width:480px;width:100%;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.flash .fhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.flash .fword{font-family:"Noto Serif SC",Georgia,serif;font-size:34px;font-weight:900;margin:18px 0 2px}
.flash .fph{color:var(--muted);font-size:13px;margin-bottom:6px}
.flash .fmean{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
.flash.revealed .fmean{display:block}
.flash .fmean .pos{display:inline-block;font-size:12px;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:2px 8px;font-weight:700;margin-bottom:6px}
.flash .fmean p{margin:4px 0;font-size:15px}
.flash .fmean .ex{color:var(--muted);font-size:13px;border-left:3px solid var(--amber-soft);padding-left:8px;margin-top:8px}
.flash .factions{display:flex;gap:10px;margin-top:22px}
.flash .factions .btn{flex:1;padding:12px 6px}
.flash .fcount{margin-top:14px;text-align:center;color:var(--muted);font-size:12px}

/* 测试 */
.quiz .qword{font-family:"Noto Serif SC",Georgia,serif;font-size:30px;font-weight:900;text-align:center;margin:10px 0}
.quiz .qphon{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.qopt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:14px;margin-bottom:10px;color:var(--ink-soft)}
.qopt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.qopt:disabled{opacity:.75}
.quizscore{text-align:center;padding:26px 10px}
.quizscore .sc{font-size:56px;font-weight:900;font-family:"Noto Serif SC",serif}
.quizscore .sc b{font-size:24px}

/* ===== 听力 / 阅读 / 写作 ===== */
.itemhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.itemhead .ttl{font-weight:800;font-family:"Noto Serif SC",serif}
.itemhead .badge{font-size:11px;font-weight:700;color:var(--primary);background:var(--primary-soft);border-radius:8px;padding:3px 9px}
.passage{background:#FDFCF9;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14.5px;color:var(--ink-soft);white-space:pre-line}
.passage b{color:var(--ink)}
.listenbar{display:flex;gap:10px;align-items:center;margin:14px 0}
.playbtn{width:52px;height:52px;border-radius:50%;background:var(--primary);color:#fff;border:none;flex:none;
  display:flex;align-items:center;justify-content:center;transition:background .12s}
.playbtn.paused{background:var(--amber)}
.playbtn svg{width:22px;height:22px}
.qa{margin-top:14px}
.qa .qn{font-weight:800;font-size:14.5px;margin-bottom:8px}
.qa .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;font-size:13.5px;margin-bottom:8px;color:var(--ink-soft)}
.qa .opt.correct{border-color:var(--good);background:var(--good-soft);color:var(--good);font-weight:700}
.qa .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.explain{display:none;background:var(--good-soft);border-radius:10px;padding:12px;font-size:13px;color:#145c38;margin-top:4px}
.explain.show{display:block}
.qaresult{font-size:13px;font-weight:700;color:var(--good);margin-bottom:8px}
.transcript{display:none;margin-top:14px}
.transcript.show{display:block}
.transcript .tbox{background:#F1EFE7;border-radius:10px;padding:14px;font-size:13.5px;color:var(--ink-soft);white-space:pre-line}

/* 写作 */
.wprompt{border:1px solid var(--line);border-radius:var(--radius-sm);padding:13px 14px;background:var(--card);cursor:pointer;box-shadow:var(--shadow)}
.wprompt h4{margin:0;font-size:15px;font-family:"Noto Serif SC",serif}
.wprompt p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.draftbox textarea{width:100%;min-height:180px;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.7;resize:vertical;background:#fff}
.wcount{font-size:12px;color:var(--muted);text-align:right;margin-top:6px}
.modelessay{background:#FDFCF9;border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;color:var(--ink-soft);white-space:pre-line}
.phrases{display:flex;flex-wrap:wrap;gap:8px}
.phrases .ph{background:var(--amber-soft);color:#8a5c0a;border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}

/* ===== 底部移动导航 ===== */
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
.bottomnav .bn{flex:1;border:none;background:none;color:var(--muted);font-size:10px;font-weight:700;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomnav .bn.active{color:var(--primary)}
.bottomnav .bn svg{width:22px;height:22px}

/* ===== 数据页 / 空态 ===== */
.datarow{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:14px}
.datarow:last-child{border-bottom:none}
.datarow .k{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.note{font-size:12px;color:var(--muted);background:#F1EFE7;border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.5}
.hidden{display:none !important}

/* ===== 桌面 ===== */
@media (min-width:768px){
  .app{padding:0 24px 60px}
  .bottomnav{display:none}
  .metricgrid{grid-template-columns:repeat(4,1fr)}
  .modulegrid{grid-template-columns:repeat(4,1fr)}
  .listencol{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  nav.tabs .tab .tic{display:none}
}
@media (max-width:767px){
  .headstatus small{display:none}
}
</style>
</head>
<body>
<header class="apphead">
  <div class="brandrow">
    <div class="logo">C6</div>
    <div class="brandtext"><b>六级冲刺</b><span>背单词 · 听 · 读 · 写</span></div>
    <div class="headstatus">
      <div class="streak" id="headStreak">连续 0 天</div>
      <small>已学 <b id="headLearned">0</b> 词</small>
    </div>
  </div>
  <nav class="tabs" id="topTabs"></nav>
</header>

<main class="app" id="app"></main>

<!-- ===== 底部移动导航 ===== -->
<nav class="bottomnav" id="bottomNav"></nav>

<!-- ===== 词卡模态 ===== -->
<div class="flashmask" id="flashMask">
  <div class="flash" id="flashCard">
    <div class="fhead"><span id="flashPos"></span><button class="btn ghost" id="flashClose">关闭</button></div>
    <div class="fword" id="flashWord"></div>
    <div class="fph" id="flashPhon"></div>
    <div class="fmean">
      <span class="pos" id="flashPos2"></span>
      <p id="flashMean"></p>
      <p class="ex" id="flashEx"></p>
    </div>
    <div class="factions">
      <button class="btn bad" data-mark="new">不认识</button>
      <button class="btn amber" data-mark="learning">模糊</button>
      <button class="btn good" data-mark="known">认识</button>
    </div>
    <div class="fcount" id="flashCount"></div>
  </div>
</div>

<script>
"use strict";
/* ============ 六级核心词表（学习用，非官方词库） ============ */
const WORDS = [
{w:"abandon",ph:"/əˈbændən/",pos:"v.",mean:"放弃；抛弃；离弃",ex:"He abandoned the plan when it proved too costly."},
{w:"abundant",ph:"/əˈbʌndənt/",pos:"a.",mean:"丰富的；充裕的",ex:"The region is abundant in natural resources."},
{w:"academic",ph:"/ˌækəˈdemɪk/",pos:"a./n.",mean:"学术的；学术界人士",ex:"She published several academic papers last year."},
{w:"accelerate",ph:"/əkˈseləreɪt/",pos:"v.",mean:"加速；促进",ex:"The new policy will accelerate economic growth."},
{w:"accumulate",ph:"/əˈkjuːmjəleɪt/",pos:"v.",mean:"积累；聚集",ex:"Dust had accumulated on the shelves."},
{w:"accurate",ph:"/ˈækjərət/",pos:"a.",mean:"准确的；精确的",ex:"The report gave an accurate description of the event."},
{w:"acquire",ph:"/əˈkwaɪə(r)/",pos:"v.",mean:"获得；取得；习得",ex:"Children acquire language skills quickly."},
{w:"adapt",ph:"/əˈdæpt/",pos:"v.",mean:"适应；改编",ex:"It took him months to adapt to the new climate."},
{w:"adequate",ph:"/ˈædɪkwət/",pos:"a.",mean:"充足的；适当的",ex:"Make sure you get adequate sleep before the exam."},
{w:"administration",ph:"/ədˌmɪnɪˈstreɪʃn/",pos:"n.",mean:"管理；行政；政府",ex:"The university administration announced a new policy."},
{w:"advocate",ph:"/ˈædvəkeɪt/",pos:"v./n.",mean:"提倡；主张；拥护者",ex:"Many doctors advocate regular exercise."},
{w:"alternative",ph:"/ɔːlˈtɜːnətɪv/",pos:"n./a.",mean:"替代方案；可供选择的",ex:"We considered an alternative route to the city."},
{w:"ambiguous",ph:"/æmˈbɪɡjuəs/",pos:"a.",mean:"含糊的；模棱两可的",ex:"His answer was deliberately ambiguous."},
{w:"ambition",ph:"/æmˈbɪʃn/",pos:"n.",mean:"雄心；抱负；目标",ex:"Her ambition is to become a scientist."},
{w:"analyze",ph:"/ˈænəlaɪz/",pos:"v.",mean:"分析；解析",ex:"We need to analyze the data carefully."},
{w:"annual",ph:"/ˈænjuəl/",pos:"a.",mean:"每年的；年度的",ex:"The company holds an annual meeting in December."},
{w:"anticipate",ph:"/ænˈtɪsɪpeɪt/",pos:"v.",mean:"预期；预料；期待",ex:"We anticipate a rise in demand next year."},
{w:"apparent",ph:"/əˈpærənt/",pos:"a.",mean:"明显的；表面上的",ex:"It became apparent that they had been wrong."},
{w:"appeal",ph:"/əˈpiːl/",pos:"v./n.",mean:"呼吁；吸引力；上诉",ex:"The idea of a quiet weekend appeals to me."},
{w:"approach",ph:"/əˈprəʊtʃ/",pos:"v./n.",mean:"接近；方法；途径",ex:"We need a new approach to solve the problem."},
{w:"appropriate",ph:"/əˈprəʊpriət/",pos:"a.",mean:"适当的；恰当的",ex:"Wear clothing appropriate for the occasion."},
{w:"approve",ph:"/əˈpruːv/",pos:"v.",mean:"批准；赞成；认可",ex:"The committee approved the budget."},
{w:"arbitrary",ph:"/ˈɑːbɪtrəri/",pos:"a.",mean:"任意的；武断的",ex:"The decision seemed completely arbitrary."},
{w:"artificial",ph:"/ˌɑːtɪˈfɪʃl/",pos:"a.",mean:"人造的；人工的；虚假的",ex:"Artificial intelligence is transforming many industries."},
{w:"assess",ph:"/əˈses/",pos:"v.",mean:"评估；评定",ex:"Teachers assess students' progress regularly."},
{w:"assume",ph:"/əˈsjuːm/",pos:"v.",mean:"假定；承担；呈现",ex:"We assume that everyone has read the report."},
{w:"attain",ph:"/əˈteɪn/",pos:"v.",mean:"达到；获得；实现",ex:"She attained her goal through hard work."},
{w:"authority",ph:"/ɔːˈθɒrəti/",pos:"n.",mean:"权威；当局；权限",ex:"The local authority is responsible for schools."},

/* ---- 状态 ---- */
const KEY = "cet6trainer_v1";
function defaultState(){return {wordStatus:{},streak:0,lastDate:null,right:0,wrong:0,quizBest:0};}
let state=(()=>{try{return Object.assign(defaultState(),JSON.parse(localStorage.getItem(KEY))||{});}catch(e){return defaultState();}})();
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function bumpStudy(){const t=todayKey();if(state.lastDate!==t){const diff=state.lastDate?Math.round((new Date(t)-new Date(state.lastDate))/86400000):99;state.streak=(diff===1)?state.streak+1:1;state.lastDate=t;}save();}
function learnedCount(){let n=0;for(const k in state.wordStatus){if(state.wordStatus[k]==="known")n++;}return n;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

/* ---- 路由 ---- */

/* ---- 词库 ---- */
let UI={wordsMode:"list",queue:[],qIdx:0,quiz:null,detail:null,search:"",wordsFilter:"all"};
function filteredWords(){
  const f=UI.wordsFilter||"all",q=(UI.search||"").trim().toLowerCase();
  return WORDS.filter(w=>{
    const st=state.wordStatus[w.w]||"new";
    if(f==="new"&&st!=="new")return false;
    if(f==="learn"&&st!=="learning")return false;
    if(f==="known"&&st!=="known")return false;
    if(q&&!w.w.toLowerCase().includes(q)&&!w.mean.includes(q))return false;
    return true;
  });
}
function tagOf(st){return st==="known"?["known","已掌握"]:st==="learning"?["learn","模糊"]:["new","生词"];}
function renderWords(){
  if(UI.wordsMode==="quiz"){renderQuiz();return;}
  const fw=filteredWords();
  const lc=learnedCount();
  app.innerHTML=`
  <div class="wordtop">
    <div class="searchwrap"><span class="sicon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
      <input id="wsearch" type="search" placeholder="搜索单词或中文释义" value="${esc(UI.search||"")}"></div>
    <div class="filterrow">
      ${["all","new","learn","known"].map(f=>{const l={all:"全部",new:"生词",learn:"模糊",known:"已掌握"}[f];return `<button class="chip ${UI.wordsFilter===f?"active":""}" data-f="${f}">${l} <b>${f==="all"?WORDS.length:f==="known"?lc:f==="learn"?WORDS.filter(w=>(state.wordStatus[w.w]||"new")==="learning").length:WORDS.filter(w=>(state.wordStatus[w.w]||"new")==="new").length}</b></button>`;}).join("")}
      <div class="grow"></div>
      <button class="btn ghost" data-action="startStudy">开始学习</button>
    </div>
  </div>
  <div class="card" style="padding:14px">
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted)">
      <span>本组 ${fw.length} 个词</span><span>已掌握 ${lc}/${WORDS.length}</span></div>
    <div class="progress" style="margin-top:8px"><i style="width:${Math.round(lc/WORDS.length*100)}%"></i></div>
  </div>
  <div class="wordlist">
  ${fw.length?fw.map(w=>{
    const st=state.wordStatus[w.w]||"new";const[cls,lab]=tagOf(st);
    return `<div class="worditem" data-open="${esc(w.w)}">
      <div class="top"><span class="w">${esc(w.w)}</span><span class="ph">${esc(w.ph||"")}</span><span class="pos">${esc(w.pos)}</span><span class="tag ${cls}">${lab}</span></div>
      <div class="mean">${esc(w.mean)}</div>
      <div class="ex">${esc(w.ex||"")}</div>

    </div>`;}).join(""):`<div class="empty">没有符合条件的单词，换个筛选或搜索词。</div>`}
  </div>`;
  const si=$("#wsearch");if(si){si.value=UI.search||"";si.addEventListener("input",e=>{UI.search=e.target.value;UI.wordsLimit=300;renderWords();});}

function showFlash(idx){
  const q=UI.queue;if(!q.length)return;
  UI.qIdx=Math.max(0,Math.min(idx,q.length-1));
  const w=q[UI.qIdx];
  const st=state.wordStatus[w.w]||"new";
  $("#flashWord").textContent=w.w;
  $("#flashPhon").textContent=w.ph||"";
  $("#flashPos").textContent="生词卡片 · 点释义查看";
  $("#flashPos2").textContent=w.pos;
  $("#flashMean").textContent=w.mean;
  $("#flashEx").textContent=w.ex||"";
  $("#flashCount").textContent=(UI.qIdx+1)+" / "+q.length+" · 当前："+(st==="known"?"已掌握":st==="learning"?"模糊":"生词");
  $("#flashCard").classList.remove("revealed");
  $("#flashMask").classList.add("show");
}
function renderQuiz(){
  if(!UI.quiz){UI.quiz=buildQuiz();}
  const qi=UI.quiz;
  const item=qi.words[qi.i];
  app.innerHTML=`
  <div class="sectiontitle"><h2>词汇测试</h2><span>第 ${qi.i+1}/${qi.words.length} 题 · 选正确释义</span></div>
  <div class="card quiz">
    <div class="qword">${esc(item.w.w)}</div>
    <div class="qphon">${esc(item.w.ph||"")} · ${esc(item.w.pos)}</div>
    <div id="qopts">${item.opts.map((o,oi)=>`<button class="qopt" data-qopt="${oi}">${esc(o)}</button>`).join("")}</div>
    <div id="qfeed"></div>
    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn ghost" data-action="quitQuiz">退出</button>
      <button class="btn block" data-action="nextQ" id="nextBtn" style="display:none">下一题</button>
    </div>
  </div>`;
}
function buildQuiz(){
  const pool=WORDS.slice().sort(()=>Math.random()-.5).slice(0,10);
  const words=pool.map(w=>{
    const others=WORDS.filter(x=>x.w!==w.w).sort(()=>Math.random()-.5).slice(0,3);
    const opts=[w.mean,...others.map(x=>x.mean)].sort(()=>Math.random()-.5);
    return {w,opts,correct:opts.indexOf(w.mean)};
  });
  return {words,i:0,right:0};
}
function finishQuiz(){
  const q=UI.quiz;state.right+=q.right;state.wrong+=(q.words.length-q.right);
  if(q.right>state.quizBest)state.quizBest=q.right;bumpStudy();save();
  app.innerHTML=`<div class="card quizscore">
    <div class="sc">${q.right}<b>/10</b></div>
    <p style="color:var(--muted)">本组答对 ${q.right} 题 · 历史最高 ${state.quizBest} 分</p>
    <div style="display:flex;gap:10px"><button class="btn block" data-action="againQuiz">再来一组</button>
    <button class="btn ghost" data-action="backWords">返回词库</button></div></div>`;
  UI.quiz=null;
}

    <div class="card">
      ${it.q.map((qi,qiIdx)=>`<div class="qa"><div class="qn">${qiIdx+1}. ${esc(qi.q)}</div>
        ${qi.opts.map((o,oi)=>`<button class="opt" data-ropt="${qiIdx}-${oi}">${esc(o)}</button>`).join("")}
        <div class="explain" data-rexp="${qiIdx}">${esc(qi.exp)}</div></div>`).join("")}
      <button class="btn block" data-action="readSubmit">提交判分</button>
      <button class="btn ghost block" style="margin-top:10px" data-action="backRead">返回列表</button>
    </div>`;
    return;
  }
  app.innerHTML=`<div class="sectiontitle"><h2>阅读训练</h2><span>模拟材料 · 共 ${READING.length} 篇</span></div>
  ${READING.map(it=>`<div class="card wprompt" data-openr="${it.id}">
    <div class="itemhead"><span class="ttl">${esc(it.title)}</span><span class="badge">${esc(it.tag)}</span></div>
    <p>${esc(it.q.length)} 道选择题 · 含答案解析</p></div>`).join("")}
  <div class="note">阅读为整理的学习材料（非官方真题），每篇附答案解析。</div>`;
}

/* ---- 写作 ---- */
function renderWrite(){
  if(UI.detail){const it=WRITING.find(x=>x.id===UI.detail);
    if(!it){UI.detail=null;renderWrite();return;}
    app.innerHTML=`
    <div class="sectiontitle"><h2>写作练习</h2><span>${esc(it.title)}</span></div>
    <div class="card"><span class="badge">${esc(it.tag)}</span>
      <p style="margin-top:10px;font-size:14px;color:var(--ink-soft)">${esc(it.req)}</p></div>
    <div class="card"><div class="itemhead"><span class="ttl">思路提纲</span></div>
      <div class="todaylist">${it.outline.map((o,i)=>`<div class="tlitem"><div class="nm">${i+1}. ${esc(o)}</div></div>`).join("")}</div></div>
    <div class="card"><div class="itemhead"><span class="ttl">高分表达</span></div>
      <div class="phrases">${it.phrases.map(p=>`<span class="ph">${esc(p)}</span>`).join("")}</div></div>
    <div class="card draftbox"><div class="itemhead"><span class="ttl">我的草稿</span></div>
      <textarea id="draft" placeholder="在这里练习写作……">${esc((UI.drafts||{})[it.id]||"")}</textarea>
      <div class="wcount" id="wcount">0 词</div></div>
    <div class="card"><div class="itemhead"><span class="ttl">参考范文</span>
      <button class="btn ghost" id="showModel">查看范文</button></div>
      <div class="modelessay" id="model" style="display:none">${esc(it.model)}</div></div>
    <button class="btn ghost block" data-action="backWrite">返回列表</button>`;
    const d=$("#draft");if(d){const upd=()=>{const w=(d.value.match(/[a-zA-Z]+(?:['’-][a-zA-Z]+)?/g)||[]).length;$("#wcount").textContent=w+" 词";};d.addEventListener("input",()=>{upd();UI.drafts=UI.drafts||{};UI.drafts[it.id]=d.value;});upd();}
    const sm=$("#showModel");if(sm)sm.addEventListener("click",()=>{const m=$("#model");m.style.display=m.style.display==="none"?"block":"none";sm.textContent=m.style.display==="none"?"查看范文":"收起范文";});
    return;
  }
  app.innerHTML=`<div class="sectiontitle"><h2>写作训练</h2><span>模拟题目 · 共 ${WRITING.length} 篇</span></div>
  ${WRITING.map(it=>`<div class="card wprompt" data-openw="${it.id}">
    <h4>${esc(it.title)}</h4>
    <p>${esc(it.tag)} · ${it.outline.length} 步提纲 + 范文</p></div>`).join("")}
  <div class="note">写作题为整理的学习材料（非官方真题），含提纲、高分表达与范文参考。</div>`;
}

/* ---- 全局渲染 ---- */
function render(){renderTabs();const r=currentRoute();
  if(r==="home")renderHome();
  else if(r==="words"){UI.wordsMode="list";renderWords();}
  else if(r==="listen"){UI.detail=null;UI.rAnswer=null;renderListen();}
  else if(r==="read"){UI.detail=null;UI.rAnswer=null;renderRead();}
  else if(r==="write"){UI.detail=null;renderWrite();}
}

/* ---- 朗读（听力） ---- */
function speak(text){if(!("speechSynthesis" in window)){alert("当前浏览器不支持语音朗读");return;}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
  u.lang="en-US";u.rate=0.92;speechSynthesis.speak(u);}

/* ---- 事件 ---- */
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]");if(nav){go(nav.dataset.nav);return;}
  const reset=e.target.closest("[data-action=reset]");
  if(reset){if(confirm("确定重置所有学习进度？此操作不可恢复。")){state=defaultState();save();UI={wordsMode:"list",queue:[],qIdx:0,quiz:null,detail:null,search:"",wordsFilter:"all",wordsLimit:300};render();}return;}
  if(e.target.closest("[data-action=backWords]")){UI.wordsMode="list";UI.quiz=null;render();return;}
  if(e.target.closest("[data-action=againQuiz]")){UI.quiz=null;render();return;}
  if(e.target.closest("[data-action=quitQuiz]")){UI.wordsMode="list";UI.quiz=null;render();return;}
  if(e.target.closest("[data-action=startStudy]")){const fw=filteredWords();if(!fw.length){alert("本组没有可学习的词");return;}UI.queue=fw;UI.qIdx=0;showFlash(0);return;}
  if(e.target.closest("[data-action=nextQ]")){const q=UI.quiz;q.i++;if(q.i>=q.words.length){finishQuiz();}else renderQuiz();return;}
  if(e.target.closest("[data-action=backListen]")){UI.detail=null;render();return;}
  if(e.target.closest("[data-action=backRead]")){UI.detail=null;UI.rAnswer=null;render();return;}
  if(e.target.closest("[data-action=backWrite]")){UI.detail=null;render();return;}
  if(e.target.closest("[data-action=readSubmit]")){const it=READING.find(x=>x.id===UI.detail);if(!it)return;
    let right=0;it.q.forEach((qi,i)=>{const ans=UI.rAnswer[i];if(ans===qi.ans){right++;const ex=$(`[data-rexp="${i}"]`);if(ex)ex.classList.add("show");}});
    state.right+=right;state.wrong+=(it.q.length-right);bumpStudy();save();
    it.q.forEach((qi,i)=>{if(UI.rAnswer[i]!==undefined){const btn=$(`[data-ropt="${i}-${UI.rAnswer[i]}"]`);if(btn)btn.classList.add(UI.rAnswer[i]===qi.ans?"correct":"wrong");const ab=$(`[data-ropt="${i}-${qi.ans}"]`);if(ab&&UI.rAnswer[i]!==qi.ans)ab.classList.add("correct");}});
    const b=e.target.closest("[data-action=readSubmit]");b.disabled=true;b.textContent="得分 "+right+"/"+it.q.length;
    return;}
  const mark=e.target.closest("[data-mark]");
  if(mark){const w=mark.dataset.mark,val=mark.dataset.val;state.wordStatus[w]=val;bumpStudy();save();renderWords();return;}
  const fchip=e.target.closest("[data-f]");if(fchip){UI.wordsFilter=fchip.dataset.f;UI.wordsLimit=300;renderWords();return;}
  const open=e.target.closest("[data-open]");
  if(open){const w=WORDS.find(x=>x.w===open.dataset.open);if(w){UI.queue=[w];showFlash(0);}return;}
  const openl=e.target.closest("[data-openl]");if(openl){UI.detail=openl.dataset.openl;UI.rAnswer=null;render();return;}
  const openr=e.target.closest("[data-openr]");if(openr){UI.detail=openr.dataset.openr;UI.rAnswer=[];render();return;}
  const openw=e.target.closest("[data-openw]");if(openw){UI.detail=openw.dataset.openw;render();return;}
  const qopt=e.target.closest("[data-qopt]");
  if(qopt){const qi=UI.quiz;const idx=+qopt.dataset.qopt;
    document.querySelectorAll("[data-qopt]").forEach(b=>b.disabled=true);
    qopt.classList.add(idx===qi.words[qi.i].correct?"correct":"wrong");
    const cb=document.querySelector(`[data-qopt="${qi.words[qi.i].correct}"]`);if(cb&&idx!==qi.words[qi.i].correct)cb.classList.add("correct");
    if(idx===qi.words[qi.i].correct){qi.right++;$("#qfeed").innerHTML=`<div class="qaresult">回答正确</div>`;}
    else{$("#qfeed").innerHTML=`<div class="qaresult">回答错误 · 正确答案：${esc(qi.words[qi.i].mean)}</div>`;}
    $("#nextBtn").style.display="inline-flex";return;}
  const lopt=e.target.closest("[data-lopt]");
  if(lopt){const[a,oi]=lopt.dataset.lopt.split("-").map(Number);const it=LISTENING.find(x=>x.id===UI.detail);if(!it)return;const qa=it.q[a];
    document.querySelectorAll(`[data-lopt^="${a}-"]`).forEach(b=>b.disabled=true);
    lopt.classList.add(oi===qa.ans?"correct":"wrong");
    const cb=document.querySelector(`[data-lopt="${a}-${qa.ans}"]`);if(cb&&oi!==qa.ans)cb.classList.add("correct");
    const ex=$(`[data-exp="${a}"]`);if(ex)ex.classList.add("show");return;}
  const ropt=e.target.closest("[data-ropt]");
  if(ropt){const[a,oi]=ropt.dataset.ropt.split("-").map(Number);UI.rAnswer=UI.rAnswer||[];UI.rAnswer[a]=oi;
    document.querySelectorAll(`[data-ropt^="${a}-"]`).forEach(b=>{if(+b.dataset.ropt.split("-")[1]!==oi)b.classList.remove("correct");});
    ropt.classList.add("correct");return;}
});
/* 词卡模态 */
$("#flashMask").addEventListener("click",e=>{if(e.target.id==="flashMask"||e.target.closest("#flashClose")){$("#flashMask").classList.remove("show");return;}
  const fb=e.target.closest("[data-mark]");
  if(fb){const w=UI.queue[UI.qIdx];if(!w)return;state.wordStatus[w.w]=fb.dataset.mark;bumpStudy();save();
    if(UI.qIdx<UI.queue.length-1){showFlash(UI.qIdx+1);}else{$("#flashMask").classList.remove("show");renderWords();}}else{
    const card=e.target.closest(".flash .fword")||e.target.closest(".flash .fph");
    if(card||e.target.id==="flashPhon"||e.target.id==="flashWord"){$("#flashCard").classList.add("revealed");}}});
/* 听力播放 */
document.addEventListener("click",e=>{const pb=e.target.closest("#playBtn");if(!pb)return;
  const it=LISTENING.find(x=>x.id===pb.dataset.play);if(!it)return;
  const paused=pb.classList.toggle("paused");
  if(paused){speechSynthesis&&speechSynthesis.cancel();pb.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>`;}
  else{speak(it.script);pb.innerHTML=`<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;}});
document.addEventListener("click",e=>{const tt=e.target.closest("#toggleTrans");if(!tt)return;
  const t=$("#transcript");const show=t.classList.toggle("show");tt.textContent=show?"收起原文":"显示原文";});

window.addEventListener("hashchange",render);
render();
</script>
</body>
